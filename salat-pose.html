<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>عدّاد الصلاة</title>
<style>
:root{--bg:#f6f3ec;--fg:#1d2420;--card:#fff;--line:#d9d3c4;--y:#f5c542;--g:#3f9e60;--mut:#6b7a70;--btn:#1f5f46;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#121915;--fg:#eaf0ec;--card:#1b251f;--line:#2f3d34;--y:#d9a81f;--g:#2f8a50;--mut:#93a499;--btn:#2f8a50;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif;padding:12px;max-width:600px;margin:0 auto}
h1{font-size:1.3rem;text-align:center;margin:8px 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
button{font:inherit;font-size:1rem;padding:11px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
button.p{background:var(--btn);color:#fff;border:0}button:disabled{opacity:.5}
button.sel{outline:3px solid var(--y)}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.row button{flex:1;min-width:30%}
table{width:100%;border-collapse:collapse;text-align:center;table-layout:fixed}
th,td{padding:12px 2px;border:1px solid var(--line);font-size:1rem}
thead th{font-size:.62rem;color:var(--mut);padding:6px 1px;line-height:1.3}
tbody th{font-size:.75rem}
th.c1,td.c1{background:var(--y);color:#222}
th.c2,td.c2{background:var(--g);color:#fff}
td.na{color:var(--mut)}
#st{font-size:1.2rem;text-align:center;font-weight:600;margin:0 0 10px;min-height:2.2em}
.vw{position:relative}.vw video,.vw canvas{width:100%;max-height:200px;border-radius:10px;background:#000;object-fit:cover}
.vw canvas{position:absolute;inset:0;height:100%}
.sm{font-size:.85rem;color:var(--mut);margin:8px 0 0}
label{display:block;font-size:.9rem;margin-top:8px}input[type=range]{width:100%}
.hide{display:none}
</style>
</head>
<body>
<h1>عدّاد الصلاة</h1>
<div id="setup" class="card">
  <div style="margin-bottom:8px">اختر الصلاة:</div>
  <div class="grid" id="pr"></div>
  <div class="row"><button id="camBtn">السماح بالكاميرا</button></div>
  <div class="row"><button id="go" class="p" disabled>ابدأ</button></div>
  <p class="sm">ضع الهاتف على السجادة بزاوية تقارب ٤٥° أمام موضع رأسك في السجود. تُعالَج الصورة على جهازك فقط ولا يتم تسجيل شيء.</p>
  <p class="sm" id="ld">جارٍ تحميل نموذج التعرّف على الجسم…</p>
</div>
<div id="runbox" class="hide">
  <p id="st"></p>
  <div class="card" style="padding:4px"><table><thead><tr id="hd"></tr></thead><tbody id="tb"></tbody></table></div>
  <div class="card">
    <div class="vw"><video id="v" autoplay muted playsinline></video><canvas id="ov"></canvas></div>
    <p class="sm" id="info"></p>
    <label>عتبة السجود (قرب الكتفين من الكاميرا) <input type="range" id="k" min="1.2" max="3" step="0.1" value="1.8"></label>
    <div class="row"><button id="nx">التالي ›</button><button id="undo">تراجع</button><button id="flip">عكس النقاط</button><button id="reset">إعادة</button></div>
  </div>
</div>

<script type="module">
import {PoseLandmarker,FilesetResolver} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";
var PR={fajr:["الفجر",2],dhuhr:["الظهر",4],asr:["العصر",4],maghrib:["المغرب",3],isha:["العشاء",4]};
var ORD=["الأولى","الثانية","الثالثة","الرابعة"];
var STEPS=["القراءة","الركوع","الرفع من الركوع","السجدة الأولى","الجلوس بين السجدتين","السجدة الثانية","التشهد"];
var HDR=["قراءة","ركوع","رفع من الركوع","سجود أول","جلوس بين السجدتين","سجود ثاني","التشهد"];
var $=function(i){return document.getElementById(i)};
var key=null,n=0,rows=[],cur=0,st=0,sitT=null,hist=[],camOn=false,pose=null,phase="setup",base=null,samples=[],t0=0,cand="قيام",candAt=0,curP="قيام",lastT=0,mir=true,turn={a:false,b:false};

try{
  var fs=await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  pose=await PoseLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task"},runningMode:"VIDEO",numPoses:1});
  $("ld").textContent="النموذج جاهز ✓";
}catch(e){$("ld").textContent="تعذّر تحميل النموذج: "+e.message}
chk();

var pr=$("pr");
Object.keys(PR).forEach(function(k){var b=document.createElement("button");b.textContent=PR[k][0]+" ("+PR[k][1]+")";b.onclick=function(){key=k;[].forEach.call(pr.children,function(c){c.classList.remove("sel")});b.classList.add("sel");chk()};pr.appendChild(b)});
function chk(){$("go").disabled=!(key&&camOn&&pose)}
$("hd").innerHTML="<th></th>"+HDR.map(function(h){return "<th>"+h+"</th>"}).join("");

$("camBtn").onclick=async function(){
  try{
    $("v").srcObject=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user"},audio:false});
    camOn=true;$("camBtn").textContent="الكاميرا تعمل ✓";chk();
    try{if(navigator.wakeLock)navigator.wakeLock.request("screen")}catch(e){}
  }catch(e){$("camBtn").textContent="تعذّر الوصول إلى الكاميرا"}
};
$("go").onclick=function(){
  n=PR[key][1];rows=[];
  for(var i=0;i<n;i++){var r=[0,0,0,0,0,0,((i===1&&n>2)||i===n-1)?0:null];rows.push(r)}
  cur=0;st=0;rows[0][0]=1;hist=[];clearTimeout(sitT);samples=[];t0=Date.now();phase="calib";curP="قيام";cand="قيام";
  $("setup").classList.add("hide");$("runbox").classList.remove("hide");render();loop();
};
$("reset").onclick=function(){clearTimeout(sitT);phase="setup";$("runbox").classList.add("hide");$("setup").classList.remove("hide")};
$("flip").onclick=function(){mir=!mir};
$("nx").onclick=function(){if(phase!=="run"||fin())return;if(st===5&&rows[cur][6]===null||st===6)nextRow();else go(st+1);render()};
$("undo").onclick=function(){if(!hist.length)return;var o=JSON.parse(hist.pop());rows=o.rows;cur=o.cur;st=o.st;clearTimeout(sitT);render()};

function snap(){hist.push(JSON.stringify({rows:rows,cur:cur,st:st}));if(hist.length>60)hist.shift()}
function fin(){return cur>=n}
function go(s){
  if(s<=st)return;snap();clearTimeout(sitT);var r=rows[cur];
  for(var j=0;j<s;j++)if(r[j]!==null)r[j]=2;
  r[s]=1;st=s;
  turn={a:false,b:false};
}
function nextRow(){
  snap();clearTimeout(sitT);var r=rows[cur];
  for(var j=0;j<7;j++)if(r[j]!==null)r[j]=2;
  cur++;st=0;if(cur<n)rows[cur][0]=1;
}
function needT(){return rows[cur][6]!==null}
function onPose(p){
  if(fin())return;
  if(p==="سجود"){
    if(st<3)go(3);else if(st===4)go(5);
    return;
  }
  if(st===0){if(p==="ركوع")go(1)}
  else if(st===1){if(p==="قيام")go(2)}
  else if(st===3)go(4);
  else if(st===5){if(needT())go(6);else nextRow()}
  else if(st===6){if(p==="قيام"&&cur<n-1)nextRow()}
}
function render(){
  if(phase==="calib")$("st").textContent="قف مستقيماً للمعايرة…";
  else $("st").textContent=fin()?"تمّت الصلاة، تقبّل الله":"الركعة "+ORD[cur]+" — "+STEPS[st]+(st===6&&cur===n-1?" (ينتهي بالتسليم يميناً ويساراً)":"");
  $("tb").innerHTML=rows.map(function(r,i){
    var cl=i<cur?"c2":(i===cur&&!fin()?"c1":"");
    return '<tr><th class="'+cl+'">ركعة '+(i+1)+"</th>"+r.map(function(v){
      return v===2?'<td class="c2">✓</td>':v===1?'<td class="c1">…</td>':v===null?'<td class="na">–</td>':"<td></td>";
    }).join("")+"</tr>";
  }).join("");
}

function loop(){
  if(phase==="setup")return;
  requestAnimationFrame(loop);
  var v=$("v"),now=performance.now();
  if(!v.videoWidth||now-lastT<100)return;lastT=now;
  var lm=pose.detectForVideo(v,now).landmarks[0],f=null;
  var ov=$("ov"),g=ov.getContext("2d");ov.width=v.videoWidth;ov.height=v.videoHeight;g.clearRect(0,0,ov.width,ov.height);
  if(lm){
    [0,11,12,23,24].forEach(function(i){var x=mir?1-lm[i].x:lm[i].x;g.fillStyle="#f5c542";g.beginPath();g.arc(x*ov.width,lm[i].y*ov.height,6,0,7);g.fill()});
    var a=lm[11],b=lm[12];
    if(Math.min(a.visibility,b.visibility)>0.4){var sw0=Math.hypot(a.x-b.x,a.y-b.y);f={sw:sw0,sy:(a.y+b.y)/2,yaw:(lm[0].x-(a.x+b.x)/2)/sw0}}
  }
  if(phase==="calib"){
    if(f)samples.push(f);
    $("st").textContent="قف مستقيماً للمعايرة… "+Math.max(Math.ceil((3000-(Date.now()-t0))/1000),0);
    if(Date.now()-t0>=3000){
      if(samples.length<5){t0=Date.now();samples=[];return}
      base={sw:samples.reduce(function(s,x){return s+x.sw},0)/samples.length,sy:samples.reduce(function(s,x){return s+x.sy},0)/samples.length,yaw:samples.reduce(function(s,x){return s+x.yaw},0)/samples.length};
      phase="run";render();
    }
    return;
  }
  var ratio=f?f.sw/base.sw:99,dy=f?f.sy-base.sy:0,yaw=f?f.yaw-base.yaw:0,k=parseFloat($("k").value),name;
  if(!f||ratio>k)name="سجود";
  else if(ratio>1+(k-1)*0.4)name="ركوع";
  else if(dy>0.15)name="جلوس";
  else name="قيام";
  $("info").textContent="الوضعية المكتشفة: "+name+" — القرب "+(f?ratio.toFixed(2):"—")+" — الانخفاض "+dy.toFixed(2)+" — الالتفات "+yaw.toFixed(2);
  if(st===6&&cur===n-1){if(yaw>0.3)turn.a=true;if(yaw<-0.3)turn.b=true;if(turn.a&&turn.b){nextRow();render();return}}
  if(name!==cand){cand=name;candAt=Date.now()}
  if(cand!==curP&&Date.now()-candAt>=500){curP=cand;onPose(cand);render()}
}
</script>
</body>
</html>
